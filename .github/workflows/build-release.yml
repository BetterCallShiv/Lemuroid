name: Build Release APKs

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish standalone APK to GitHub Releases'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'e.g alpha-1.0.0'
        required: true
        default: 'alpha-1.0.0'
      draft:
        description: 'Draft Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build AlphaFreeBundle Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
            echo "Keystore decoded successfully"
          else
            echo "No custom keystore provided, building with default key"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build AlphaFreeBundle Release APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :lemuroid-app:assembleAlphaFreeBundleRelease --stacktrace

      - name: Clean up Keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks"

      - name: Order and Rename APKs for Release
        run: |
          cd lemuroid-app/build/outputs/apk/alphaFreeBundle/release/
          for f in *.apk; do
            case "$f" in
              *armeabi-v7a*) mv "$f" "01-$f" ;;
              *arm64-v8a*)   mv "$f" "02-$f" ;;
              *x86_64*)      mv "$f" "04-$f" ;;
              *x86*)         mv "$f" "03-$f" ;;
              *universal*)   mv "$f" "05-$f" ;;
            esac
          done
          ls -la

      - name: Publish APKs to GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          tag_name: ${{ inputs.release_tag }}
          name: AlphaLemuroid ${{ inputs.release_tag }}
          draft: ${{ inputs.draft }}
          prerelease: false
          files: lemuroid-app/build/outputs/apk/alphaFreeBundle/release/*.apk
          
