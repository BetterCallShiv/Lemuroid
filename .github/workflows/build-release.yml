name: Build Release APKs

on:
  workflow_dispatch:

jobs:
  build:
    name: Build AlphaFreeBundle Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
            echo "Keystore decoded successfully"
          else
            echo "No custom keystore provided, building with default key"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build AlphaFreeBundle Release APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :lemuroid-app:assembleAlphaFreeBundleRelease --stacktrace

      - name: Clean up Keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks"

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: AlphaLemuroid-v1.0.0-Release-APKs
          path: lemuroid-app/build/outputs/apk/alphaFreeBundle/release/*.apk
